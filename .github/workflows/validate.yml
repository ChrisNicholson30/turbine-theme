name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated theme matches the token source
        run: python3 build/build_theme.py --check
      - name: Current schema keys and WCAG AA (validator)
        run: python3 build/validate_turbine.py themes/turbine.json build/schema_keys.txt
      - name: Pinned v0.2.0 build also validates
        run: |
          python3 build/build_theme.py --strict --out /tmp/turbine-v0.2.0.json
          python3 build/validate_turbine.py /tmp/turbine-v0.2.0.json build/schema_keys_v0.2.0.txt
      - name: Full contrast report
        run: python3 build/build_theme.py --report
      - name: Theme JSON is well-formed
        run: python3 -c "import json; json.load(open('themes/turbine.json'))"
