name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "themes/**", "build/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site carries the current theme data
        run: python3 build/build_theme.py --check
      - name: Publish site/ to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix site -b gh-pages-build
          git push --force origin gh-pages-build:gh-pages
